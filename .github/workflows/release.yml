# Release
#
# Publishes a GitHub Release with provenance attestations for every v* tag.
# The tag is created on main by scripts/tag-github-release.sh as the last step
# of the Azure → GitHub sync, and must match .claude-plugin/plugin.json.
#
# Verify an artifact with:
#   gh attestation verify <artifact> --repo locaweb/cofounder

name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref_name }}

jobs:
  release:
    name: Build, Attest & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the GitHub Release
      id-token: write       # OIDC token for the Sigstore signing certificate
      attestations: write   # store the attestations in the repository
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check tag against plugin.json and main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(jq -r .version .claude-plugin/plugin.json)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match plugin.json version $version (expected v$version)"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $TAG points to $GITHUB_SHA, which is not on main"
            exit 1
          fi

      - name: Build artifacts
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir dist
          git archive --format=tar.gz -o "dist/cofounder-skills-${TAG}.tar.gz" "$GITHUB_SHA" skills
          cp skills/cofounder-computer-setup/scripts/install.sh dist/install.sh
          (cd dist && sha256sum -- * > SHA256SUMS)
          cat dist/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            dist/cofounder-skills-${{ github.ref_name }}.tar.gz
            dist/install.sh

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$TAG" \
            --generate-notes
